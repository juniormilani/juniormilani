# Configuração de alvos do Prospector de Frotas RS
# Ajuste livremente: nada disso deve estar hardcoded no código.

uf: RS
include_mei: false

# Municípios prioritários (nomes como na tabela Municipios da Receita, em maiúsculas).
# Deixe vazio para tratar o RS inteiro igual. Preencher conforme a área de atendimento.
municipios_prioritarios: []
#  - PORTO ALEGRE
#  - CANOAS
#  - SAPUCAIA DO SUL
#  - ESTEIO
#  - SAO LEOPOLDO
#  - NOVO HAMBURGO
#  - GRAVATAI
#  - CACHOEIRINHA
#  - CAXIAS DO SUL

# CNAEs-alvo agrupados por segmento. prioridade: 1 = mais quente.
#
# Filtros do match por CNAE secundário (opcionais em cada segmento):
#   match_secundario: true|false
#       aceita estabelecimentos que têm o CNAE do segmento só como secundário (padrão: true).
#       Pode ser sobrescrito por execução: `prospector filter --secundario fretamento,transporte_carga`
#       (ou `--secundario todos` / `--secundario nenhum`).
#   secundario_excluir_principais: [CNAEs]
#       no match secundário, ignora estabelecimentos cujo CNAE principal esteja nesta lista
#       (ex.: revendas de veículos que declaram locação como secundário). O match principal não é afetado.
segmentos:
  fretamento:
    prioridade: 1
    cnaes: ["4929901", "4929902", "4929903", "4929904", "4929999"]
  combustiveis_perigosos:
    prioridade: 1
    cnaes: ["4930203", "4681802"]   # produtos perigosos + TRR
    match_secundario: true
    secundario_excluir_principais: []
    # Sugestão (postos de combustível, ~900 leads no RS em 2026-09):
    # secundario_excluir_principais: ["4731800"]
  transporte_carga:
    prioridade: 2
    cnaes: ["4930201", "4930202", "4930204"]
  transporte_escolar:
    prioridade: 2
    cnaes: ["4924800"]
  transporte_coletivo:
    prioridade: 2
    cnaes: ["4921301", "4921302", "4922101", "4922102", "4922103"]
  transporte_valores:
    prioridade: 2
    cnaes: ["8012900"]
  coleta_residuos:
    prioridade: 3
    cnaes: ["3811400", "3812200"]
  locadoras:
    prioridade: 3
    cnaes: ["7711000"]
    match_secundario: true
    secundario_excluir_principais: []
    # Sugestão (revendas de veículos, ~1.450 leads no RS em 2026-09):
    # secundario_excluir_principais: ["4511101", "4511102", "4512902"]
  ambulancias:
    prioridade: 3
    cnaes: ["8621601", "8621602"]
    match_secundario: true   # a maioria dos matches secundários são hospitais e clínicas

# Palavras-chave procuradas nos sites (case/acento-insensitive)
keywords_site:
  - frota
  - rastreamento
  - monitoramento
  - telemetria
  - camera
  - seguranca
  - veiculos
  - onibus
  - caminhoes
  - carretas
  - fretamento
  - combustivel

places:
  match_nome_min_similaridade: 80   # rapidfuzz token_set_ratio

scoring:
  pesos:
    cnae_principal_alvo: 25
    cnae_secundario_alvo: 10
    segmento_prioridade_1: 10
    segmento_prioridade_2: 5
    rntrc_ou_anp: 15
    porte_epp_ou_demais: 10
    capital_social_acima_limite: 5
    tem_filiais: 10
    mais_de_3_anos: 10
    tem_site: 3
    tem_whatsapp: 4
    tem_email: 3
    keywords_frota_no_site: 5
    municipio_prioritario: 5
  capital_social_limite: 100000
  faixas:
    A: 70
    B: 50
